<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Radio Player">
  <defs>
    <linearGradient id="cabinet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="45%" stop-color="#6B3F1F"/>
      <stop offset="100%" stop-color="#4A2A14"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2118"/>
      <stop offset="100%" stop-color="#14100C"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F4D27A"/>
      <stop offset="50%" stop-color="#C9963A"/>
      <stop offset="100%" stop-color="#8A641F"/>
    </linearGradient>
    <radialGradient id="amber" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFE08A"/>
      <stop offset="55%" stop-color="#F0A020"/>
      <stop offset="100%" stop-color="#A85A00"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App tile -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#1B1714"/>

  <!-- Radio cabinet -->
  <rect x="18" y="34" width="92" height="62" rx="10" fill="url(#cabinet)"/>
  <rect x="22" y="38" width="84" height="54" rx="8" fill="url(#face)"/>

  <!-- Speaker grille -->
  <g stroke="#6A4A2A" stroke-width="1.6" stroke-linecap="round">
    <line x1="28" y1="48" x2="58" y2="48"/>
    <line x1="28" y1="54" x2="58" y2="54"/>
    <line x1="28" y1="60" x2="58" y2="60"/>
    <line x1="28" y1="66" x2="58" y2="66"/>
    <line x1="28" y1="72" x2="58" y2="72"/>
    <line x1="28" y1="78" x2="58" y2="78"/>
  </g>

  <!-- Tuning dial -->
  <circle cx="84" cy="58" r="16" fill="url(#amber)" filter="url(#glow)"/>
  <circle cx="84" cy="58" r="16" fill="none" stroke="url(#brass)" stroke-width="2.4"/>
  <circle cx="84" cy="58" r="2.2" fill="#3A2208"/>
  <line x1="84" y1="58" x2="93" y2="48" stroke="#3A2208" stroke-width="2" stroke-linecap="round"/>
  <g fill="#6B4010" opacity="0.55">
    <circle cx="84" cy="45" r="1"/>
    <circle cx="95" cy="58" r="1"/>
    <circle cx="84" cy="71" r="1"/>
    <circle cx="73" cy="58" r="1"/>
  </g>

  <!-- Knobs -->
  <circle cx="72" cy="82" r="4.2" fill="url(#brass)"/>
  <circle cx="84" cy="82" r="4.2" fill="url(#brass)"/>
  <circle cx="96" cy="82" r="4.2" fill="url(#brass)"/>
  <circle cx="72" cy="82" r="1.3" fill="#3A2208"/>
  <circle cx="84" cy="82" r="1.3" fill="#3A2208"/>
  <circle cx="96" cy="82" r="1.3" fill="#3A2208"/>

  <!-- Power lamp -->
  <circle cx="32" cy="84" r="2.4" fill="#5CFF7A" filter="url(#glow)"/>

  <!-- Antenna -->
  <path d="M40 34 L40 22 L56 14" fill="none" stroke="url(#brass)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="14" r="2.2" fill="url(#brass)"/>
</svg>
